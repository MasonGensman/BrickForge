[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brickforge"
version = "0.1.0-alpha.1"
description = "AI-assisted LEGO design companion"
authors = [
    {name = "Mason Gensman"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "PySide6>=6.11"
]

[tool.setuptools.packages.find]
where = ["src"]